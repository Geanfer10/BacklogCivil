<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backlog de Construção Civil</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #12161f;
    --card: #171c27;
    --border: #232938;
    --text: #f2f3f5;
    --muted: #8b93a3;
    --accent: #ff6b57;

    --status-nao-iniciado: #808080;
    --status-planejado: #3874ff;
    --status-em-andamento: #ff8b3d;
    --status-pendente: #e2445c;
    --status-concluido: #00c875;

    --prio-baixa: #3874ff;
    --prio-media: #ff8b3d;
    --prio-alta: #e2445c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  header {
    padding: 28px 40px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 20px;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    margin: 0 0 6px;
    font-size: 28px;
    font-weight: 800;
  }

  header .subtitle {
    color: var(--muted);
    font-size: 14px;
  }

  header .subtitle a {
    color: var(--accent);
    text-decoration: underline;
  }

  .counters {
    display: flex;
    gap: 36px;
  }

  .counter {
    text-align: center;
  }

  .counter .num {
    font-size: 26px;
    font-weight: 800;
    line-height: 1;
  }

  .counter .label {
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 4px;
  }

  .counter.urgente .num { color: var(--status-pendente); }
  .counter.andamento .num { color: var(--status-em-andamento); }
  .counter.backlog .num { color: #cfd3db; }
  .counter.concluido .num { color: var(--status-concluido); }

  .filters {
    padding: 18px 40px;
    display: flex;
    gap: 36px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }

  .filter-group .filter-title {
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .chip-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .chip {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    transition: 0.15s;
  }

  .chip:hover { border-color: var(--accent); }

  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a0f0c;
    font-weight: 700;
  }

  .search-box {
    margin-left: auto;
  }

  .search-box input {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    width: 260px;
  }

  main {
    padding: 24px 40px 60px;
  }

  .group-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 30px 0 14px;
  }

  .group-header:first-child { margin-top: 0; }

  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  .group-header h2 {
    font-size: 17px;
    margin: 0;
  }

  .group-header .count {
    color: var(--muted);
    font-size: 14px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .card .thumb {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
    background: #1d222e;
  }

  .card .thumb.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
  }

  .card .card-body {
    padding: 16px;
  }

  .card .atividade {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 10px;
    line-height: 1.3;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }

  .tag {
    font-size: 11.5px;
    padding: 3px 9px;
    border-radius: 5px;
    font-weight: 700;
    color: #0b0e14;
  }

  .tag.plain {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-weight: 500;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }

  .card-footer .os {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .empty-state {
    color: var(--muted);
    font-size: 13px;
    padding: 20px 0;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Backlog de Construção Civil</h1>
    <div class="subtitle">
      PCM · Goiás Verde —
      <a href="https://messigean18s-team.monday.com/boards/18430512760" target="_blank">abrir board no Monday</a>
    </div>
  </div>
  <div class="counters">
    <div class="counter urgente"><div class="num" id="count-urgente">0</div><div class="label">Urgente</div></div>
    <div class="counter andamento"><div class="num" id="count-andamento">0</div><div class="label">Em andamento</div></div>
    <div class="counter backlog"><div class="num" id="count-backlog">0</div><div class="label">Backlog</div></div>
    <div class="counter concluido"><div class="num" id="count-concluido">0</div><div class="label">Concluído</div></div>
  </div>
</header>

<div class="filters">
  <div class="filter-group">
    <div class="filter-title">Status</div>
    <div class="chip-row" id="status-filters"></div>
  </div>
  <div class="filter-group">
    <div class="filter-title">Prioridade</div>
    <div class="chip-row" id="prioridade-filters"></div>
  </div>
  <div class="filter-group search-box">
    <div class="filter-title">Buscar</div>
    <input type="text" id="search-input" placeholder="atividade, OS, solicitante...">
  </div>
</div>

<main id="main-content">
  <div class="empty-state">Carregando dados...</div>
</main>

<footer id="footer-updated"></footer>

<script>
const STATUS_COLORS = {
  "Não Iniciado": "var(--status-nao-iniciado)",
  "Planejado": "var(--status-planejado)",
  "Em Andamento": "var(--status-em-andamento)",
  "Pendente": "var(--status-pendente)",
  "Concluído": "var(--status-concluido)",
};

const PRIORIDADE_COLORS = {
  "Baixa": "var(--prio-baixa)",
  "Média": "var(--prio-media)",
  "Alta": "var(--prio-alta)",
};

let allData = null;
let activeStatus = null;
let activePrioridade = null;

function fmtDate(iso) {
  if (!iso) return "sem data";
  const parts = iso.split("-");
  if (parts.length !== 3) return iso;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function buildChips(containerId, values, colorMap, onSelect) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  values.forEach(v => {
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.textContent = v;
    chip.addEventListener("click", () => onSelect(v, chip));
    container.appendChild(chip);
  });
}

function render() {
  if (!allData) return;

  const search = document.getElementById("search-input").value.trim().toLowerCase();

  const groupCounters = { topics: 0, group_mm72zwqs: 0, group_mm72f941: 0, group_mm72xfpz: 0 };

  const main = document.getElementById("main-content");
  main.innerHTML = "";

  let totalRendered = 0;

  allData.groups.forEach(group => {
    const filtered = group.items.filter(item => {
      if (activeStatus && item.status !== activeStatus) return false;
      if (activePrioridade && item.prioridade !== activePrioridade) return false;
      if (search) {
        const haystack = `${item.atividade} ${item.ordem_servico} ${item.solicitante}`.toLowerCase();
        if (!haystack.includes(search)) return false;
      }
      return true;
    });

    groupCounters[group.id] = filtered.length;
    totalRendered += filtered.length;

    const dotColors = {
      topics: "var(--status-pendente)",
      group_mm72zwqs: "var(--status-em-andamento)",
      group_mm72f941: "#cfd3db",
      group_mm72xfpz: "var(--status-concluido)",
    };

    const header = document.createElement("div");
    header.className = "group-header";
    header.innerHTML = `
      <div class="dot" style="background:${dotColors[group.id] || '#666'}"></div>
      <h2>${group.title}</h2>
      <span class="count">(${filtered.length})</span>
    `;
    main.appendChild(header);

    if (filtered.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "Nenhuma atividade neste grupo com os filtros atuais.";
      main.appendChild(empty);
      return;
    }

    const cardsWrap = document.createElement("div");
    cardsWrap.className = "cards";

    filtered.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";

      const statusColor = STATUS_COLORS[item.status] || "var(--muted)";
      const prioColor = PRIORIDADE_COLORS[item.prioridade] || "var(--muted)";
      const foto = (item.fotos && item.fotos.length > 0) ? item.fotos[0] : null;

      const thumbHtml = foto
        ? `<img class="thumb" src="${foto}" alt="Foto da atividade" loading="lazy">`
        : `<div class="thumb placeholder">sem foto</div>`;

      card.innerHTML = `
        ${thumbHtml}
        <div class="card-body">
          <div class="atividade">${item.atividade}</div>
          <div class="tags">
            ${item.status ? `<span class="tag" style="background:${statusColor}">${item.status}</span>` : ""}
            ${item.prioridade ? `<span class="tag" style="background:${prioColor}">${item.prioridade}</span>` : ""}
            ${item.ordem_servico ? `<span class="tag plain">OS: ${item.ordem_servico}</span>` : ""}
          </div>
          <div class="card-footer">
            <div>
              <div>${item.solicitante ? item.solicitante : "sem solicitante"}</div>
              <div class="os">Solicitado: ${fmtDate(item.data_solicitacao)}</div>
            </div>
            <div>${fmtDate(item.data_execucao)}</div>
          </div>
        </div>
      `;
      cardsWrap.appendChild(card);
    });

    main.appendChild(cardsWrap);
  });

  if (totalRendered === 0) {
    main.innerHTML = '<div class="empty-state">Nenhuma atividade encontrada com os filtros atuais.</div>';
  }

  document.getElementById("count-urgente").textContent = groupCounters.topics;
  document.getElementById("count-andamento").textContent = groupCounters.group_mm72zwqs;
  document.getElementById("count-backlog").textContent = groupCounters.group_mm72f941;
  document.getElementById("count-concluido").textContent = groupCounters.group_mm72xfpz;
}

function selectChip(container, chipEl, current, value) {
  const chips = container.querySelectorAll(".chip");
  chips.forEach(c => c.classList.remove("active"));
  if (current === value) {
    return null;
  }
  chipEl.classList.add("active");
  return value;
}

async function init() {
  try {
    const res = await fetch("data.json", { cache: "no-store" });
    allData = await res.json();
  } catch (e) {
    document.getElementById("main-content").innerHTML =
      '<div class="empty-state">Não foi possível carregar data.json. Verifique se o GitHub Action já rodou pelo menos uma vez.</div>';
    return;
  }

  const statusValues = ["Não Iniciado", "Planejado", "Em Andamento", "Pendente", "Concluído"];
  const prioridadeValues = ["Baixa", "Média", "Alta"];

  buildChips("status-filters", statusValues, STATUS_COLORS, (value, chipEl) => {
    activeStatus = selectChip(document.getElementById("status-filters"), chipEl, activeStatus, value);
    render();
  });

  buildChips("prioridade-filters", prioridadeValues, PRIORIDADE_COLORS, (value, chipEl) => {
    activePrioridade = selectChip(document.getElementById("prioridade-filters"), chipEl, activePrioridade, value);
    render();
  });

  document.getElementById("search-input").addEventListener("input", render);

  if (allData.generated_at) {
    const d = new Date(allData.generated_at);
    document.getElementById("footer-updated").textContent =
      "Última atualização: " + d.toLocaleString("pt-BR");
  }

  render();
}

init();
</script>

</body>
</html>

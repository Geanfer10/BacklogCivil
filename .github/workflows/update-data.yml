name: Atualizar dados do backlog

on:
  schedule:
    # A cada 5 minutos (mínimo prático do GitHub Actions; execuções podem
    # atrasar alguns minutos dependendo da fila do GitHub, principalmente
    # em repositórios gratuitos)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Buscar dados do Monday.com
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: python fetch_data.py

      - name: Publicar data.json se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Atualiza data.json automaticamente"
          git push
